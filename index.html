<script>
  // Farbthema vor dem ersten Zeichnen setzen (kein Aufblitzen)
  (function () {
    var w = "auto"; try { w = localStorage.getItem("darstellung") || "auto"; } catch (e) {}
    var dunkel = w === "dunkel" || (w === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dunkel ? "dunkel" : "hell";
  })();
</script>
